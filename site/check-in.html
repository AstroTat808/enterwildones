<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wild Ones Check-In</title><style>body{margin:0;background:#050505;color:#f5f1e8;font-family:system-ui}.wrap{max-width:680px;margin:auto;padding:35px 20px}h1{font:48px Georgia,serif}input,select,button{width:100%;padding:14px;margin:8px 0;background:#111;color:#fff;border:1px solid #333;border-radius:8px}button{background:#d6a951;color:#080808;font-weight:800}.result{padding:25px;margin-top:18px;border:1px solid #333;border-radius:12px;font-size:22px;font-weight:800}.ok{border-color:#6c9}.bad{border-color:#d66}video{width:100%;margin-top:12px;border-radius:12px;background:#000}.muted{color:#999;font-size:13px}</style></head><body><main class="wrap"><p>ENTER WILD ONES · STAFF</p><h1>Check-In</h1><section id="login"><select id="event"><option value="aureva-2026">AUREVA 2026</option><option value="halora-2027">HALORA 2027</option><option value="sunveil-2027">SUNVEIL 2027</option><option value="nocturne-2027">NOCTURNE 2027</option></select><input id="password" type="password" placeholder="Check-in password"><button id="loginBtn">Open Gate</button></section><section id="gate" hidden><p id="activeEvent"></p><input id="token" placeholder="Paste ticket URL or token"><button id="scanBtn">Validate & Check In</button><button id="cameraBtn" type="button">Start Camera Scanner</button><video id="video" playsinline hidden></video><p class="muted">Camera scanning uses the browser's built-in QR detector when available. Manual paste remains available on all devices.</p><div id="result" class="result" hidden></div><button id="logoutBtn">Log Out</button></section></main><script src="/assets/js/check-in.js" defer></script></body></html>
