<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wild Ones Bar</title><style>body{margin:0;background:#050505;color:#f5f1e8;font-family:system-ui}.wrap{max-width:680px;margin:auto;padding:35px 20px}h1{font:48px Georgia,serif}input,select,button{width:100%;padding:14px;margin:8px 0;background:#111;color:#fff;border:1px solid #333;border-radius:8px}button{background:#d6a951;color:#080808;font-weight:800}.result{padding:22px;margin-top:18px;border:1px solid #333;border-radius:12px}.ok{border-color:#6c9}.bad{border-color:#d66}.credits{font-size:44px;font-weight:800}.muted{color:#999;font-size:13px}video{width:100%;margin-top:12px;border-radius:12px;background:#000}</style></head><body><main class="wrap"><p>ENTER WILD ONES · BAR</p><h1>Bartender Console</h1><section id="login"><select id="event"><option value="aureva-2026">AUREVA 2026</option><option value="halora-2027">HALORA 2027</option><option value="sunveil-2027">SUNVEIL 2027</option><option value="nocturne-2027">NOCTURNE 2027</option></select><input id="password" type="password" placeholder="Bar password"><button id="loginBtn">Open Bar Console</button></section><section id="bar" hidden><p id="activeEvent"></p><input id="token" placeholder="Paste or scan digital ticket"><button id="lookupBtn">Load Drink Package</button><button id="cameraBtn" type="button">Start Camera Scanner</button><video id="video" playsinline hidden></video><div id="result" class="result" hidden></div><section id="controls" hidden><input id="wristband" placeholder="Wristband ID"><button id="activateBtn">Activate Wristband</button><button id="redeemBtn">Redeem 1 Credit</button></section><p class="muted">Verify matching photo ID and wristband before serving. Ticket must already be checked in.</p><button id="logoutBtn">Log Out</button></section></main><script src="/assets/js/bar.js" defer></script></body></html>
