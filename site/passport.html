<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wild Ones Passport</title><link rel="stylesheet" href="/assets/css/app.css"><style>.wrap{max-width:980px;margin:auto;padding:54px 22px 100px}.panel,.realm{border:1px solid #ffffff22;background:#0006;border-radius:18px;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:25px}.realm h2{font:42px Georgia,serif;margin:.25em 0}.realm p{color:#aaa}input,button{padding:14px;border-radius:8px;border:1px solid #ffffff2a;background:#111;color:#fff}button{background:#d6a951;color:#080808;font-weight:800;cursor:pointer}.loginrow{display:flex;gap:10px;flex-wrap:wrap}.loginrow input{flex:1;min-width:240px}</style></head><body><main class="wrap"><p>ENTER WILD ONES · THE FOUR REALMS</p><h1>WILD ONES PASSPORT</h1><section id="login" class="panel" hidden><h2>Open your Passport</h2><p>Use the email attached to your Wild Ones profile. We’ll send a one-time sign-in link.</p><div class="loginrow"><input id="email" type="email" autocomplete="email" placeholder="Email address"><button id="send">Send Sign-In Link</button></div><div id="turnstile"></div><p id="status"></p></section><section id="account" hidden><div class="panel"><h2 id="welcome"></h2><p id="progress"></p><button id="logout">Sign Out</button></div><div id="realms" class="grid"></div></section></main><script src="/assets/js/passport.js" defer></script></body></html>
