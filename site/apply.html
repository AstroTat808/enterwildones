<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Request Access - ENTER WILD ONES</title><link rel="stylesheet" href="/assets/css/app.css"></head><body data-realm="cycle"><div class="ambient"></div><header class="topbar"><a class="brand" href="/">WILD ONES <span>ENTER THE CYCLE</span></a><nav><a href="/">The Cycle</a><a href="/invite">Redeem Invite</a></nav></header><main class="shell"><div class="shell-inner"><p class="eyebrow" data-event-eyebrow>ACCESS REQUEST</p><h1>REQUEST<br>ACCESS.</h1><p class="intro" data-event-intro>Loading this realm...</p><div id="gateNotice" class="notice">Checking access-request status...</div><form id="applyForm" class="panel hidden" novalidate><input type="hidden" name="eventId" id="eventId"><input class="hidden" aria-hidden="true" tabindex="-1" name="website" id="website"><div class="form-grid"><div class="field"><label>Full legal name<input name="fullName" maxlength="120" required></label></div><div class="field"><label>Preferred name<input name="preferredName" maxlength="120"></label></div><div class="field"><label>Email<input name="email" type="email" maxlength="254" required></label></div><div class="field"><label>Mobile phone<input name="phone" type="tel" maxlength="40" required></label></div><div class="field"><label>City / island<input name="location" maxlength="160" required></label></div><div class="field"><label>Instagram / public profile<input name="instagram" maxlength="120" placeholder="@username"></label></div><div class="field full"><label>How did you hear about this event?<input name="referral" maxlength="160" required></label></div><div class="field full"><label>Connection to the music / community<textarea name="community" maxlength="1500"></textarea></label></div><div class="field full"><label data-why-label>Why do you want to attend?<textarea name="whyAttend" minlength="30" maxlength="2000" required></textarea></label></div><div class="field full"><label>Anyone attending with you? Optional.<textarea name="groupNames" maxlength="1000"></textarea></label></div></div><div class="checks"><label class="check"><input type="checkbox" name="conductAck" required><span>I agree to follow the Wild Ones Code of Conduct and event rules.</span></label><label class="check"><input type="checkbox" name="selectionAck" required><span>I understand a request does not guarantee approval, invitation or admission.</span></label><label class="check"><input type="checkbox" name="privacyAck" required><span>I acknowledge the privacy notice and event-administration use of this information.</span></label><label class="check"><input type="checkbox" name="marketingOptIn"><span>Send me future Wild Ones announcements and access opportunities.</span></label></div><div id="turnstile-widget" class="turnstile-slot"></div><div class="form-actions"><button class="button" type="submit" id="submitButton">Submit Request</button><span id="formStatus" class="form-status"></span></div></form><div id="success" class="panel hidden"><p class="eyebrow">REQUEST RECEIVED</p><h2>YOU'RE IN REVIEW.</h2><p class="intro">Your request has been recorded for <strong data-success-event></strong>. Approval and ticket access are separate steps.</p><a class="button ghost" href="/">Return to the Cycle</a></div></div></main><script src="/assets/js/apply.js" defer></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" defer></script></body></html>
