name: Branding QA
on:
  push:
    branches: [feature/four-realms-branding-admin]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: branding-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package source and installed dependencies for offline review
        run: |
          git archive --format=tar.gz HEAD > reviewed-source.tar.gz
          tar -czf reviewed-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source
          path: |
            reviewed-source.tar.gz
            reviewed-dependencies.tar.gz
          retention-days: 3
