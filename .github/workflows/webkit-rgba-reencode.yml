name: One-time WebKit RGBA logo repair

on:
  push:
    branches: [fix/webkit-rgba-artwork]
    paths: ['.github/workflows/webkit-rgba-reencode.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/webkit-rgba-artwork
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.3.0 pillow-avif-plugin==1.5.2
      - name: Fetch browser-verified source revisions
        run: |
          git fetch --depth=1 origin 1dd55aefa542db5110331309f31b15325cf0111c
          git fetch --depth=1 origin 4b648d7cbb4183bb337b0b75d8f9bb5d33a8c7a6
      - name: Rebuild AUREVA and HALORA as standards-compliant RGBA PNG wrappers
        shell: python
        run: |
          import base64, io, pathlib, re, subprocess
          import pillow_avif  # registers AVIF decoder with Pillow
          from PIL import Image

          specs = [
              ('aureva', 'AUREVA - Realm I - Light', '1dd55aefa542db5110331309f31b15325cf0111c'),
              ('halora', 'HALORA - Realm II - Balance', '4b648d7cbb4183bb337b0b75d8f9bb5d33a8c7a6'),
          ]
          data_re = re.compile(r'data:image/(?:avif|png);base64,([^\"\']+)')

          for slug, label, commit in specs:
              repo_path = f'site/assets/images/realms/{slug}.svg'
              source_svg = subprocess.check_output(['git', 'show', f'{commit}:{repo_path}'], text=True)
              candidates = []
              for payload in data_re.findall(source_svg):
                  raw = base64.b64decode(payload, validate=True)
                  image = Image.open(io.BytesIO(raw))
                  image.load()
                  candidates.append((image.width * image.height, image.copy().convert('RGBA')))
              if not candidates:
                  raise SystemExit(f'{slug}: no decodable historical image payload found in {commit}')

              image = max(candidates, key=lambda item: item[0])[1]
              print(f'{slug}: verified source {image.size}, alpha bbox={image.getchannel("A").getbbox()}')
              if image.size != (384, 384):
                  image = image.resize((384, 384), Image.Resampling.LANCZOS)
              alpha_bbox = image.getchannel('A').getbbox()
              if not alpha_bbox or alpha_bbox[3] < 360:
                  raise SystemExit(f'{slug}: recovered artwork incomplete; alpha bbox={alpha_bbox}')

              out = io.BytesIO()
              image.save(out, format='PNG', optimize=True, compress_level=9)
              png = out.getvalue()
              if png[:8] != b'\x89PNG\r\n\x1a\n' or png[25] != 6 or b'IEND' not in png[-32:]:
                  raise SystemExit(f'{slug}: rewritten PNG failed structural checks')
              strict = Image.open(io.BytesIO(png))
              strict.load()
              if strict.mode != 'RGBA' or strict.size != (384, 384):
                  raise SystemExit(f'{slug}: strict decode mismatch {strict.mode} {strict.size}')

              encoded = base64.b64encode(png).decode('ascii')
              wrapper = (
                  f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" '
                  f'width="384" height="384" role="img" aria-label="{label}">'
                  f'<title>{label}</title>'
                  f'<image width="384" height="384" preserveAspectRatio="xMidYMid meet" '
                  f'href="data:image/png;base64,{encoded}"/>'
                  f'</svg>'
              )
              pathlib.Path(repo_path).write_text(wrapper, encoding='utf-8')
              print(f'{slug}: clean RGBA PNG={len(png)} bytes, SVG={len(wrapper)} bytes')

          validator = pathlib.Path('scripts/validate-branding.mjs')
          text = validator.read_text(encoding='utf-8')
          text = text.replace('svg.length>5000&&svg.length<100000', 'svg.length>5000&&svg.length<250000')
          validator.write_text(text, encoding='utf-8')

      - name: Validate rebuilt artwork
        run: node scripts/validate-branding.mjs
      - name: Commit repaired assets and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/webkit-rgba-reencode.yml
          git add site/assets/images/realms/aureva.svg site/assets/images/realms/halora.svg scripts/validate-branding.mjs
          git commit -m "Repair AUREVA and HALORA SVG payloads for WebKit"
          git push origin HEAD:fix/webkit-rgba-artwork
