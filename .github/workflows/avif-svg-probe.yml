name: AVIF SVG browser probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avif-svg-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Verify nested AVIF renders in Chromium and WebKit
        shell: python
        run: |
          import http.server, pathlib, socketserver, threading
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('.').resolve()
          (root/'tests/fixtures/probe.html').write_text("<body style='background:#020203'><img id='logo' src='/tests/fixtures/avif-probe.svg' width='384'></body>")
          class Handler(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*args): pass
          server=socketserver.TCPServer(('127.0.0.1',8765),Handler)
          thread=threading.Thread(target=server.serve_forever,daemon=True);thread.start()
          try:
            with sync_playwright() as p:
              for engine in ('chromium','webkit'):
                browser=getattr(p,engine).launch()
                page=browser.new_page(viewport={'width':500,'height':500})
                response=page.goto('http://127.0.0.1:8765/tests/fixtures/probe.html',wait_until='load')
                page.wait_for_timeout(500)
                result=page.locator('#logo').evaluate("el=>({complete:el.complete,naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight})")
                print(engine,response.status,result)
                assert result['complete'] and result['naturalWidth']>0 and result['naturalHeight']>0, f'{engine} failed to render AVIF-backed SVG'
                browser.close()
          finally:
            server.shutdown()
