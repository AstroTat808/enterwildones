name: Compare live SVG control assets

on:
  push:
    branches: ["qa/logo-http-actual-a109"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare SVG controls and realm lockups
        shell: bash
        run: |
          set -euo pipefail
          bases=(
            "https://6aa9507307a0eb0008fdc711--enterwildones.netlify.app"
            "https://enterwildones.com"
          )
          paths=(
            "/favicon.svg"
            "/assets/images/social/aureva-og.svg"
            "/assets/images/social/enter-wild-ones-og.svg"
            "/assets/images/realms/aureva.svg"
            "/assets/images/realms/enter-wild-ones.svg"
          )
          for base in "${bases[@]}"; do
            echo "=== $base ==="
            for path in "${paths[@]}"; do
              code=$(curl -L -sS -o /tmp/out -w '%{http_code}' "$base$path")
              type=$(curl -L -sSI "$base$path" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2; exit}')
              bytes=$(wc -c < /tmp/out | tr -d ' ')
              printf '%-50s code=%s type=%s bytes=%s\n' "$path" "$code" "${type:-none}" "$bytes"
            done
          done
