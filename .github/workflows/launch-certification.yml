name: Launch Certification
on:
  pull_request:
    paths:
      - 'netlify/functions/**'
      - 'site/**'
      - 'scripts/validate-launch-certification.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'netlify.toml'
      - '.github/workflows/launch-certification.yml'
  push:
    branches: [main]
    paths:
      - 'netlify/functions/**'
      - 'site/**'
      - 'scripts/validate-launch-certification.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'netlify.toml'
      - '.github/workflows/launch-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
# Older certification runs become obsolete when the same branch is updated.
concurrency:
  group: launch-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Check new command surfaces
        run: |
          node --check netlify/functions/admin-readiness.mjs
          node --check site/assets/js/admin-command.js
          node --check scripts/validate-launch-certification.mjs
      - name: Run automated launch rehearsal
        run: node scripts/validate-launch-certification.mjs
