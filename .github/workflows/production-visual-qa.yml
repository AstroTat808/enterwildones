name: Production visual QA
# Fresh certification run: earlier PR #71 Actions attempts exhausted GitHub's
# 50-attempt retry limit during transient hosted-runner allocation failures.
# This preserves the existing Lighthouse, browser and visual quality gates.

on:
  # All pull requests must run required QA, even for workflow or documentation changes.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-visual-qa.yml'
      - 'site/**'
      - 'netlify/functions/**'
      - 'netlify.toml'
      - 'scripts/production_visual_qa.py'
      - 'scripts/visual_regression.py'
      - 'lighthouserc.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

concurrency:
  # v4 isolates this full QA run from a superseded v3 screenshot runner stuck
  # cancelling. This does not skip or weaken any quality gate.
  group: production-visual-qa-v4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  # v15 explicitly approves only the three intentional Turnstile form layout
  # screenshots plus the previously approved Launch Control view. Every other
  # case remains based on exact production main and regression-gated.
  VISUAL_BASELINE_KEY: enterwildones-approved-visual-baseline-v15-turnstile
  APPROVED_REALM_VISUAL_CASES: home-desktop,home-passport-close-desktop,home-footer-desktop,home-footer-phone,home-footer-wide,masthead-home-320,masthead-home-phone,masthead-home-430,masthead-home-768,masthead-home-1024,masthead-home-1366,masthead-home-1440,masthead-home-1920,masthead-event-phone,masthead-quiz-phone,masthead-passport-phone,masthead-invite-phone,masthead-apply-phone,realm-quiz-intro-desktop,realm-quiz-result-desktop,realm-quiz-intro-1366,realm-quiz-question-1366,realm-quiz-aureva-result-1366,realm-quiz-halora-result-1366,realm-quiz-sunveil-result-1366,realm-quiz-nocturne-result-1366,application-open-desktop,application-gated-desktop,passport-auth-desktop,passport-login-phone,master-cycle-card-320,master-cycle-card-390,master-cycle-card-430,master-cycle-card-pro-max,master-cycle-card-desktop,master-cycle-ceremony-320,master-cycle-ceremony-390,master-cycle-ceremony-430,master-cycle-ceremony-pro-max,master-cycle-ceremony-desktop,invite-desktop,ticket-access-desktop,public-ticket-desktop,ticket-addons-desktop,admin-applications-desktop,admin-packages-desktop,admin-operations-desktop,admin-event-day-desktop,admin-live-desktop,admin-launch-desktop,admin-rehearsal-desktop

jobs:
  source-audit:
    name: Source + build audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Full production build and validation suite
        run: npm run build
      - name: Enforce exact WebKit viewport coverage in every shard (PR gate)
        run: python -m unittest discover -s scripts -p 'test_webkit_viewport_shards.py' -v
      - name: Verify fail-closed WebKit case and browser-cleanup guards
        run: python -m unittest discover -s scripts -p 'test_webkit_failure_guard.py' -v
      - name: Static source, asset, route, and regression audit
        env:
          VISUAL_RESULTS: visual-results
        run: python scripts/production_visual_qa.py --mode source
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: production-visual-source-audit
          path: visual-results/source-audit.json
          retention-days: 14
          if-no-files-found: error

  visual-regression:
    name: Approved screenshot regression
    needs: [source-audit, deploy-sync]
    if: always() && needs.source-audit.result == 'success' && (github.event_name == 'pull_request' || needs.deploy-sync.result == 'success')
    runs-on: ubuntu-24.04
    # The pinned official image includes Chromium's OS dependencies; avoid
    # sporadic apt mirror stalls while preserving the exact browser and baselines.
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
      options: --ipc=host
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No setup-python: its host toolcache interpreter would differ from pip.
      - name: Install visual regression dependencies
        run: |
          python -m pip install playwright==1.55.0 pillow==11.3.0
          python -m playwright install chromium
      - name: Restore approved screenshot baseline
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: .visual-baselines
          key: ${{ env.VISUAL_BASELINE_KEY }}
      - name: Checkout exact PR base for deterministic reference baseline
        if: steps.baseline.outputs.cache-hit != 'true' && github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .visual-reference
          persist-credentials: false
      - name: Capture exact PR base as fallback baseline
        if: steps.baseline.outputs.cache-hit != 'true' && github.event_name == 'pull_request'
        run: >-
          python scripts/visual_regression.py
          --mode capture-reference
          --reference-site .visual-reference/site
          --baseline-dir .visual-baselines-production
      - name: Establish approved preview baseline for intentional visual changes
        if: steps.baseline.outputs.cache-hit != 'true' && github.event_name == 'pull_request'
        run: >-
          python scripts/visual_regression.py
          --mode seed-approved-preview
          --baseline-dir .visual-baselines
          --production-baseline-dir .visual-baselines-production
          --approved-cases "admin-launch-desktop,passport-login-phone,application-open-desktop,public-ticket-desktop"
      - name: Seed approved baseline from deployed production
        if: steps.baseline.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        run: python scripts/visual_regression.py --mode capture-production --baseline-dir .visual-baselines
      - name: Save approved screenshot baseline on main
        if: steps.baseline.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .visual-baselines
          key: ${{ env.VISUAL_BASELINE_KEY }}
      - name: Compare proposed UI to approved baseline
        run: python scripts/visual_regression.py --mode compare-preview --baseline-dir .visual-baselines
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: approved-visual-regression-${{ github.run_id }}
          path: visual-regression-results
          retention-days: 30
          if-no-files-found: error


  masthead-browser-qa:
    name: Masthead · ${{ matrix.browser }}
    needs: source-audit
    runs-on: ubuntu-24.04
    # Official Playwright images avoid apt mirror stalls, without changing tests.
    container:
      image: ${{ matrix.image }}
      options: --ipc=host
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            image: mcr.microsoft.com/playwright/python:v1.55.0-noble
          - browser: webkit
            image: mcr.microsoft.com/playwright/python:v1.65.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No setup-python: container pip and Python must resolve to one interpreter.
      - name: Install masthead browser dependencies
        run: |
          if [ "${{ matrix.browser }}" = "webkit" ]; then
            python -m pip install playwright==1.65.2 pillow==11.3.0
          else
            python -m pip install playwright==1.55.0 pillow==11.3.0
          fi
          python -m playwright install ${{ matrix.browser }}
      - name: Verify canonical masthead at all approved widths
        run: python scripts/visual_regression.py --mode verify-masthead --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: masthead-${{ matrix.browser }}-${{ github.run_id }}
          path: visual-regression-results/masthead-geometry-${{ matrix.browser }}.json
          retention-days: 14
          if-no-files-found: error

  lighthouse-ci:
    name: Lighthouse + Core Web Vitals gate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Lighthouse performance, accessibility, SEO and lab CWV gates
        run: npx -y @lhci/cli@0.14.0 autorun --config=./lighthouserc.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: lighthouse-release-results
          path: lighthouse-results
          retention-days: 30
          if-no-files-found: warn

  webkit-mobile-contract:
    name: WebKit mobile contract · ${{ matrix.suite }}
    if: github.event_name == 'pull_request'
    needs: source-audit
    runs-on: ubuntu-24.04
    # Preinstalled Linux browser libraries avoid apt mirror stalls; the exact
    # approved Playwright 1.65.2 browser binary is still installed and tested.
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.0-noble
      options: --ipc=host
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - suite: public
            case: home
            viewport: phone-small
          - suite: transactional
            case: passport-auth
            viewport: phone
          - suite: admin
            case: admin-applications
            viewport: tablet
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The image already supplies Python; setup-python selects a mismatched host toolcache interpreter.
      - name: Install exact approved mobile WebKit browser
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install webkit
      - name: Exercise actual mobile header and menu interactions
        env:
          # On PRs, verify the checked-out SHA, not yesterday's production build.
          # Post-merge browser-qa continues to test the real production domain.
          PRODUCTION_BASE_URL: http://127.0.0.1:8765
          VISUAL_RESULTS: visual-results
        run: |
          # Container jobs use POSIX sh by default; avoid bash-only pipefail.
          set -eu
          python -m py_compile scripts/serve_pr_visual_qa.py
          python scripts/serve_pr_visual_qa.py --port 8765 > /tmp/wildones-pr-webkit-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/passport; then break; fi
            if [ "$attempt" -eq 25 ]; then cat /tmp/wildones-pr-webkit-server.log; exit 1; fi
            sleep 1
          done
          python scripts/production_visual_qa.py \
            --mode browser --suite ${{ matrix.suite }} --browser webkit \
            --viewport-name ${{ matrix.viewport }} --case-name ${{ matrix.case }}
      - name: Save full case verdict and mobile crash evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-mobile-probe-${{ matrix.suite }}
          path: visual-results/${{ matrix.suite }}-webkit-${{ matrix.viewport }}-${{ matrix.case }}
          retention-days: 14
          if-no-files-found: warn

  turnstile-form-qa:
    name: Turnstile forms · ${{ matrix.browser }}
    if: github.event_name == 'pull_request'
    needs: source-audit
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
      options: --ipc=host
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            image: mcr.microsoft.com/playwright/python:v1.55.0-noble
            version: '1.55.0'
          - browser: webkit
            image: mcr.microsoft.com/playwright/python:v1.65.0-noble
            version: '1.65.2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install approved browser binary
        run: |
          python -m pip install playwright==${{ matrix.version }}
          python -m playwright install ${{ matrix.browser }}
      - name: Exercise all guest Turnstile forms at every viewport
        env:
          PRODUCTION_BASE_URL: http://127.0.0.1:8765
          VISUAL_RESULTS: visual-results
        run: |
          set -eu
          python scripts/serve_pr_visual_qa.py --port 8765 > /tmp/wildones-pr-turnstile.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/passport; then break; fi
            if [ "$attempt" -eq 25 ]; then cat /tmp/wildones-pr-turnstile.log; exit 1; fi
            sleep 1
          done
          python scripts/production_visual_qa.py --mode browser --suite transactional --browser ${{ matrix.browser }} --case-name passport-login
          python scripts/production_visual_qa.py --mode browser --suite transactional --browser ${{ matrix.browser }} --case-name public-tickets
          python scripts/production_visual_qa.py --mode browser --suite public --browser ${{ matrix.browser }} --case-name apply-aureva
      - name: Preserve all viewport measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turnstile-form-qa-${{ matrix.browser }}-${{ github.run_id }}
          path: visual-results
          retention-days: 14
          if-no-files-found: warn

  production-qa-gate:
    name: Production QA Gate
    if: always()
    needs: [source-audit, visual-regression, lighthouse-ci, masthead-browser-qa, webkit-mobile-contract, turnstile-form-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce pre-merge critical gates
        env:
          SOURCE_RESULT: ${{ needs.source-audit.result }}
          VISUAL_RESULT: ${{ needs.visual-regression.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse-ci.result }}
          MASTHEAD_BROWSER_RESULT: ${{ needs.masthead-browser-qa.result }}
          WEBKIT_MOBILE_RESULT: ${{ needs.webkit-mobile-contract.result }}
          TURNSTILE_FORMS_RESULT: ${{ needs.turnstile-form-qa.result }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "Source + build audit: $SOURCE_RESULT"
          echo "Approved visual regression: $VISUAL_RESULT"
          echo "Lighthouse + lab Core Web Vitals: $LIGHTHOUSE_RESULT"
          echo "Chromium/WebKit masthead geometry: $MASTHEAD_BROWSER_RESULT"
          test "$SOURCE_RESULT" = "success"
          test "$VISUAL_RESULT" = "success"
          test "$LIGHTHOUSE_RESULT" = "success"
          test "$MASTHEAD_BROWSER_RESULT" = "success"
          if [ "$IS_PULL_REQUEST" = "true" ]; then
            test "$WEBKIT_MOBILE_RESULT" = "success"
            test "$TURNSTILE_FORMS_RESULT" = "success"
          fi

  deploy-sync:
    name: Confirm production deployment
    if: github.event_name != 'pull_request'
    needs: source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for production to match the pushed static payload
        env:
          PRODUCTION_BASE_URL: https://enterwildones.com
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: python scripts/production_visual_qa.py --mode wait --before "$BEFORE_SHA"

  runtime-smoke:
    name: Production HTTP + security smoke
    if: github.event_name != 'pull_request'
    needs: deploy-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only route, API, fail-closed auth, and header checks
        env:
          PRODUCTION_BASE_URL: https://enterwildones.com
          VISUAL_RESULTS: visual-results
        run: python scripts/production_visual_qa.py --mode smoke
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: production-runtime-smoke
          path: visual-results/production-smoke.json
          retention-days: 14
          if-no-files-found: error

  browser-qa:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    needs: deploy-sync
    runs-on: ubuntu-24.04
    # Retain every Chromium/WebKit suite and viewport. Docker ships OS dependencies;
    # Playwright installs the exact selected browser version before every audit.
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.0-noble
      options: --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - suite: public
            browser: chromium
            shard: 'all'
            name: 'public · chromium'
            results_dir: 'public-chromium'
          - suite: public
            browser: webkit
            shard: '0'
            name: 'public · webkit · shard0'
            results_dir: 'public-webkit-shard0'
          - suite: public
            browser: webkit
            shard: '1'
            name: 'public · webkit · shard1'
            results_dir: 'public-webkit-shard1'
          - suite: public
            browser: webkit
            shard: '2'
            name: 'public · webkit · shard2'
            results_dir: 'public-webkit-shard2'
          - suite: public
            browser: webkit
            shard: '3'
            name: 'public · webkit · shard3'
            results_dir: 'public-webkit-shard3'
          - suite: transactional
            browser: chromium
            shard: 'all'
            name: 'transactional · chromium'
            results_dir: 'transactional-chromium'
          - suite: transactional
            browser: webkit
            shard: '0'
            name: 'transactional · webkit · shard0'
            results_dir: 'transactional-webkit-shard0'
          - suite: transactional
            browser: webkit
            shard: '1'
            name: 'transactional · webkit · shard1'
            results_dir: 'transactional-webkit-shard1'
          - suite: transactional
            browser: webkit
            shard: '2'
            name: 'transactional · webkit · shard2'
            results_dir: 'transactional-webkit-shard2'
          - suite: transactional
            browser: webkit
            shard: '3'
            name: 'transactional · webkit · shard3'
            results_dir: 'transactional-webkit-shard3'
          - suite: admin
            browser: chromium
            shard: 'all'
            name: 'admin · chromium'
            results_dir: 'admin-chromium'
          - suite: admin
            browser: webkit
            shard: '0'
            name: 'admin · webkit · shard0'
            results_dir: 'admin-webkit-shard0'
          - suite: admin
            browser: webkit
            shard: '1'
            name: 'admin · webkit · shard1'
            results_dir: 'admin-webkit-shard1'
          - suite: admin
            browser: webkit
            shard: '2'
            name: 'admin · webkit · shard2'
            results_dir: 'admin-webkit-shard2'
          - suite: admin
            browser: webkit
            shard: '3'
            name: 'admin · webkit · shard3'
            results_dir: 'admin-webkit-shard3'
          - suite: staff
            browser: chromium
            shard: 'all'
            name: 'staff · chromium'
            results_dir: 'staff-chromium'
          - suite: staff
            browser: webkit
            shard: 'all'
            name: 'staff · webkit'
            results_dir: 'staff-webkit'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Use the same image-provided interpreter for install and actual browser execution.
      - name: Verify all viewport shards cover every WebKit width exactly once
        run: python -m unittest discover -s scripts -p 'test_webkit_viewport_shards.py' -v
      - name: Install Playwright
        run: |
          if [ "${{ matrix.browser }}" = "webkit" ]; then
            python -m pip install playwright==1.65.2
          else
            python -m pip install playwright==1.55.0
          fi
          python -m playwright install ${{ matrix.browser }}
      - name: Full responsive production browser audit
        env:
          PRODUCTION_BASE_URL: https://enterwildones.com
          VISUAL_RESULTS: visual-results
        run: python scripts/production_visual_qa.py --mode browser --suite ${{ matrix.suite }} --browser ${{ matrix.browser }} --viewport-group ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: production-visual-${{ matrix.results_dir }}
          path: visual-results/${{ matrix.results_dir }}
          retention-days: 14
          if-no-files-found: error

  qa-summary:
    name: Production QA summary
    if: always() && github.event_name != 'pull_request'
    needs: [source-audit, visual-regression, lighthouse-ci, production-qa-gate, deploy-sync, runtime-smoke, browser-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Publish summary
        run: |
          {
            echo '## Production visual QA'
            echo
            echo '| Gate | Result |'
            echo '| --- | --- |'
            echo '| Source + build audit | ${{ needs.source-audit.result }} |'
            echo '| Approved screenshot regression | ${{ needs.visual-regression.result }} |'
            echo '| Lighthouse + lab Core Web Vitals | ${{ needs.lighthouse-ci.result }} |'
            echo '| Production QA Gate | ${{ needs.production-qa-gate.result }} |'
            echo '| Production deploy sync | ${{ needs.deploy-sync.result }} |'
            echo '| HTTP + security smoke | ${{ needs.runtime-smoke.result }} |'
            echo '| Responsive browser matrix | ${{ needs.browser-qa.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"
