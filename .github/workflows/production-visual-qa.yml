name: Production visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-visual-qa.yml'
      - 'site/**'
      - 'netlify/functions/**'
      - 'netlify.toml'
      - 'scripts/production_visual_qa.py'
      - 'scripts/visual_regression.py'
      - 'lighthouserc.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-visual-qa.yml'
      - 'site/**'
      - 'netlify/functions/**'
      - 'netlify.toml'
      - 'scripts/production_visual_qa.py'
      - 'scripts/visual_regression.py'
      - 'lighthouserc.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

concurrency:
  group: production-visual-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  VISUAL_BASELINE_KEY: enterwildones-approved-visual-baseline-v3

jobs:
  source-audit:
    name: Source + build audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Full production build and validation suite
        run: npm run build
      - name: Static source, asset, route, and regression audit
        env:
          VISUAL_RESULTS: visual-results
        run: python scripts/production_visual_qa.py --mode source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-visual-source-audit
          path: visual-results/source-audit.json
          retention-days: 14
          if-no-files-found: error

  visual-regression:
    name: Approved screenshot regression
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual regression dependencies
        run: |
          pip install playwright==1.55.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Restore approved screenshot baseline
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: .visual-baselines
          key: ${{ env.VISUAL_BASELINE_KEY }}
      - name: Seed approved baseline from deployed main
        if: steps.baseline.outputs.cache-hit != 'true'
        run: python scripts/visual_regression.py --mode capture-production --baseline-dir .visual-baselines
      - name: Save approved screenshot baseline
        if: steps.baseline.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .visual-baselines
          key: ${{ env.VISUAL_BASELINE_KEY }}
      - name: Compare proposed UI to approved baseline
        run: python scripts/visual_regression.py --mode compare-preview --baseline-dir .visual-baselines
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-visual-regression-${{ github.run_id }}
          path: visual-regression-results
          retention-days: 30
          if-no-files-found: error


  lighthouse-ci:
    name: Lighthouse + Core Web Vitals gate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Lighthouse performance, accessibility, SEO and lab CWV gates
        run: npx -y @lhci/cli@0.14.0 autorun --config=./lighthouserc.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-release-results
          path: lighthouse-results
          retention-days: 30
          if-no-files-found: warn

  production-qa-gate:
    name: Production QA Gate
    if: always()
    needs: [source-audit, visual-regression, lighthouse-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce pre-merge critical gates
        env:
          SOURCE_RESULT: ${{ needs.source-audit.result }}
          VISUAL_RESULT: ${{ needs.visual-regression.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse-ci.result }}
        run: |
          echo "Source + build audit: $SOURCE_RESULT"
          echo "Approved visual regression: $VISUAL_RESULT"
          echo "Lighthouse + lab Core Web Vitals: $LIGHTHOUSE_RESULT"
          test "$SOURCE_RESULT" = "success"
          test "$VISUAL_RESULT" = "success"
          test "$LIGHTHOUSE_RESULT" = "success"

  deploy-sync:
    name: Confirm production deployment
    if: github.event_name != 'pull_request'
    needs: source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for production to match the pushed static payload
        env:
          PRODUCTION_BASE_URL: https://enterwildones.com
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: python scripts/production_visual_qa.py --mode wait --before "$BEFORE_SHA"

  runtime-smoke:
    name: Production HTTP + security smoke
    if: github.event_name != 'pull_request'
    needs: deploy-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only route, API, fail-closed auth, and header checks
        env:
          PRODUCTION_BASE_URL: https://enterwildones.com
          VISUAL_RESULTS: visual-results
        run: python scripts/production_visual_qa.py --mode smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-runtime-smoke
          path: visual-results/production-smoke.json
          retention-days: 14
          if-no-files-found: error

  browser-qa:
    name: ${{ matrix.suite }} · ${{ matrix.browser }}
    if: github.event_name != 'pull_request'
    needs: deploy-sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        suite: [public, transactional, admin, staff]
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Full responsive production browser audit
        env:
          PRODUCTION_BASE_URL: https://enterwildones.com
          VISUAL_RESULTS: visual-results
        run: python scripts/production_visual_qa.py --mode browser --suite ${{ matrix.suite }} --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-visual-${{ matrix.suite }}-${{ matrix.browser }}
          path: visual-results/${{ matrix.suite }}-${{ matrix.browser }}
          retention-days: 14
          if-no-files-found: error

  qa-summary:
    name: Production QA summary
    if: always() && github.event_name != 'pull_request'
    needs: [source-audit, visual-regression, lighthouse-ci, production-qa-gate, deploy-sync, runtime-smoke, browser-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Publish summary
        run: |
          {
            echo '## Production visual QA'
            echo
            echo '| Gate | Result |'
            echo '| --- | --- |'
            echo '| Source + build audit | ${{ needs.source-audit.result }} |'
            echo '| Approved screenshot regression | ${{ needs.visual-regression.result }} |'
            echo '| Lighthouse + lab Core Web Vitals | ${{ needs.lighthouse-ci.result }} |'
            echo '| Production QA Gate | ${{ needs.production-qa-gate.result }} |'
            echo '| Production deploy sync | ${{ needs.deploy-sync.result }} |'
            echo '| HTTP + security smoke | ${{ needs.runtime-smoke.result }} |'
            echo '| Responsive browser matrix | ${{ needs.browser-qa.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"
