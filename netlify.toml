[build]
  publish = "site"
  functions = "netlify/functions"
  command = "npm run build"

[functions]
  node_bundler = "esbuild"

[functions."ticket-wallet"]
  included_files = ["netlify/functions/wallet-assets/**"]

[[redirects]]
  from = "https://www.enterwildones.com/*"
  to = "https://enterwildones.com/:splat"
  status = 301
  force = true

# Backward-compatible rewrites for legacy HTML/cached realm artwork URLs.
# These are exact paths so the live SVG assets are never intercepted by a
# placeholder matching the whole final path segment (including extensions).
[[redirects]]
  from = "/assets/images/realms/enter-wild-ones.avif"
  to = "/assets/images/realms/enter-wild-ones.svg"
  status = 200
  force = true

[[redirects]]
  from = "/assets/images/realms/aureva.avif"
  to = "/assets/images/realms/aureva.svg"
  status = 200
  force = true

[[redirects]]
  from = "/assets/images/realms/halora.avif"
  to = "/assets/images/realms/halora.svg"
  status = 200
  force = true

[[redirects]]
  from = "/assets/images/realms/sunveil.avif"
  to = "/assets/images/realms/sunveil.svg"
